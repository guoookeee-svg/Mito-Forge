# Mito-Forge Benchmark & Evaluation Framework
#
# 实验方案配置 - 定义数据集、对比工具、评估指标
# ============================================================

# ----------------------------------------------------------
# 1. 数据集定义
# ----------------------------------------------------------
datasets:
  # ---- 动物线粒体 (Illumina) ----
