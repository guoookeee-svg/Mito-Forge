name: mito-forge
description: |
  Perform mitochondrial genome assembly, polishing, and annotation from raw sequencing data.
  Use this skill when the user wants to assemble, annotate, or analyze mitochondrial genomes
  from Illumina short-read or Nanopore long-read data.

  This skill provides step-by-step instructions for the full pipeline:
  environment setup → data preparation → QC → assembly → polishing → annotation → report generation.

  Triggers: mitochondrial genome, mito assembly, mitogenome, organelle assembly,
  SPAdes, Flye, MitoZ, GetOrganelle, PMGA, MITOFY, mitochondrial annotation
